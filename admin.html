<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - EL MURAZO</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container"><h1>Panel de Administración</h1></div>
    </header>
    <main class="container">
        <!-- Login -->
        <div id="login-section" class="card admin-box">
            <h2>Iniciar Sesión</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Contraseña">
            <button id="btn-login" class="btn-primary">Entrar</button>
        </div>

        <!-- Dashboard (Oculto hasta login) -->
        <div id="dashboard-section" class="hidden">
            <div class="card admin-box">
                <h2>Añadir Nuevo Chollo</h2>
                <input type="text" id="titulo" placeholder="Título del producto">
                <input type="text" id="imagen" placeholder="URL de la imagen">
                <input type="number" id="precio-actual" placeholder="Precio actual (€)">
                <input type="number" id="precio-anterior" placeholder="Precio anterior (€)">
                <input type="text" id="enlace" placeholder="Enlace de afiliado">
                <button id="btn-add" class="btn-primary">Publicar</button>
            </div>
            <h3>Chollos Activos</h3>
            <div id="admin-productos" class="grid"></div>
        </div>
    </main>
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="admin.js"></script>
</body>
</html>
