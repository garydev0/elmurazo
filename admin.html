<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - El Murazo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Panel de Administración</h1>
        <button id="btn-logout" style="display:none;">Cerrar Sesión</button>
    </header>

    <main class="admin-container">
        <!-- Formulario de Login -->
        <div id="login-section">
            <h2>Acceso Restringido</h2>
            <input type="email" id="email" placeholder="Correo electrónico" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button id="btn-login">Entrar</button>
            <p id="login-error" style="color: red;"></p>
        </div>

        <!-- Formulario para añadir productos (Oculto hasta hacer login) -->
        <div id="upload-section" style="display: none;">
            <h2>Colgar Ladrillo en el Muro</h2>
            <form id="product-form">
                <input type="text" id="prod-title" placeholder="Título corto (ej. SSD 2TB M.2)" required>
                <input type="text" id="prod-img" placeholder="URL de la imagen" required>
                <input type="text" id="prod-price" placeholder="Precio (ej. 129,99€)" required>
                <input type="url" id="prod-link" placeholder="Enlace de afiliado Amazon" required>
                <button type="submit">Publicar Oferta</button>
            </form>
            <p id="upload-msg"></p>
        </div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
