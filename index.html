<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EL MURAZO — Autopista Digital</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">EL MURAZO</a>
    <div class="stats"><span>CARTELES: <strong id="stat-occupied" class="neon-text">0</strong>/500</span></div>
    <div class="topbar-actions">
      <button id="claim-btn" class="button button-primary">ALQUILAR CARTEL</button>
      <button id="login-btn" class="button button-ghost">LOGIN</button>
    </div>
  </header>

  <main id="viewport" class="viewport">
    <div id="camera" class="camera">
      <div id="world" class="world">
        <!-- Contenedor de carteles al fondo -->
        <div id="plots-container" class="plots-container"></div>
        <!-- Autopista en el centro -->
        <div class="highway" id="highway"></div>
        <!-- Farolas en la parte más cercana -->
        <div id="streetlights-container" class="streetlights-container"></div>
      </div>
    </div>
  </main>

  <div id="brick-modal" class="modal hidden">
    <div class="modal-card">
      <button id="close-modal" class="modal-close">×</button>
      <div id="modal-color" class="modal-color"></div>
      <div class="modal-content">
        <div id="modal-badge" class="badge hidden">MEGA</div>
        <div class="modal-id">CARTEL #<span id="modal-id-value">000</span></div>
        <h2 id="modal-title">Cartel Disponible</h2>
        <p id="modal-desc">Este espacio está libre. Alquila esta valla.</p>
        <div class="modal-meta">
          <div><span>VISITAS</span><strong id="modal-visits">0</strong></div>
          <div><span>ESTADO</span><strong id="modal-status">LIBRE</strong></div>
        </div>
        <a id="modal-link" href="#" target="_blank" class="button button-primary modal-link hidden">VISITAR WEB</a>
        <button id="modal-claim" class="button button-primary modal-claim">ALQUILAR AHORA</button>
      </div>
    </div>
  </div>

  <div id="auth-modal" class="modal hidden">
    <div class="modal-card auth-card">
      <button id="close-auth" class="modal-close">×</button>
      <h2>ACCESO</h2>
      <button id="google-login" class="button button-primary button-full">CONTINUAR CON GOOGLE</button>
      <button id="logout-btn" class="button button-ghost button-full hidden">CERRAR SESIÓN</button>
      <p id="auth-status" class="auth-status"></p>
    </div>
  </div>

  <div id="claim-modal" class="modal hidden">
    <div class="modal-card form-card">
      <button id="close-claim" class="modal-close">×</button>
      <h2>ALQUILAR CARTEL</h2>
      <form id="claim-form">
        <input type="hidden" id="claim-brick-id">
        <label>Nombre a mostrar<input id="claim-name" maxlength="20" required></label>
        <label>Descripción<textarea id="claim-desc" maxlength="140" required></textarea></label>
        <label>Enlace Web<input id="claim-link" type="url"></label>
        <label>URL del Logo<input id="claim-logo" type="url"></label>
        <label>Color del Marco<input id="claim-color" type="color" value="#8a8d91"></label>
        <label class="check-line"><input id="claim-founder" type="checkbox"> Plan MEGA</label>
        <button class="button button-primary button-full" type="submit">CONFIRMAR ALQUILER</button>
        <p id="claim-error" class="form-error"></p>
      </form>
    </div>
  </div>

  <script type="module" src="app.js?v=8"></script>
</body>
</html>
