<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Murazo</title>
    <style>
        body {
            background-color: #f4f6f9;
            margin: 0;
            padding: 40px;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: max-content; /* Permite scroll infinito */
        }
        
        .header-container {
            position: sticky;
            top: 20px;
            z-index: 50;
            text-align: center;
            background: rgba(244, 246, 249, 0.95);
            padding: 20px 40px;
            border: 3px solid #111;
            border-radius: 12px;
            box-shadow: 5px 5px 0px #111;
            margin-bottom: 30px;
        }

        h1 { margin: 0 0 10px 0; text-transform: uppercase; }
        .counter-box { font-weight: bold; background: #111; color: #fff; padding: 10px; border-radius: 5px; }

        .muro-canvas-container {
            width: 3000px; /* Tamaño CSS gigante para hacer scroll por la web */
            height: 2000px;
            background: #111;
            border: 4px solid #111;
            box-shadow: 10px 10px 0px #111;
            position: relative;
            cursor: crosshair;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <h1>El Murazo</h1>
        <p>60.000 casillas exclusivas</p>
        <div class="counter-box">Casillas libres: <span id="contador-libres">60,000</span></div>
    </div>

    <!-- Canvas seguro para la memoria: 3000x2000 (6 megapíxeles) -->
    <div class="muro-canvas-container">
        <canvas id="muroCanvas" width="3000" height="2000"></canvas>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        // Aquí iría tu config de Firebase
        
        const canvas = document.getElementById("muroCanvas");
        const ctx = canvas.getContext("2d");
        
        // Cuadrícula: 300 columnas x 200 filas = 60.000 casillas.
        const gridCols = 300;
        const gridRows = 200;
        const cellSize = 10; // 10x10 píxeles (suficiente para un logo mini)

        let casillasOcupadas = new Map();

        function dibujarMuro() {
            ctx.fillStyle = "#111115";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Red para ver las casillas
            ctx.strokeStyle = "rgba(0, 168, 204, 0.2)";
            ctx.lineWidth = 1;
            for (let x = 0; x <= canvas.width; x += cellSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y <= canvas.height; y += cellSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            document.getElementById("contador-libres").innerText = (60000 - casillasOcupadas.size).toLocaleString();
        }

        dibujarMuro(); // Inicializa el muro vacío al instante
    </script>
</body>
</html>
