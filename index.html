<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EL MURAZO - Chollos y Ofertas Top de Amazon</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container header-content">
            <h1>EL <span>MURAZO</span></h1>
            <input type="text" id="buscador" placeholder="🔍 Buscar chollos...">
        </div>
    </header>
    <main class="container">
        <div class="categories-bar" id="categorias-filtro">
            <button class="cat-btn active" data-cat="todos">🔥 Todos</button>
            <button class="cat-btn" data-cat="Tecnología">💻 Tecnología</button>
            <button class="cat-btn" data-cat="Gaming">🎮 Gaming</button>
            <button class="cat-btn" data-cat="Hogar">🏠 Hogar</button>
            <button class="cat-btn" data-cat="Accesorios">🎒 Accesorios</button>
        </div>
        <div id="grid-productos" class="grid"></div>
    </main>
    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
