<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Murazo | Cyber Wall</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #f4f5f7;
            --card-bg: #ffffff;
            --text-color: #111115;
            --accent-cyan: #00a8cc;
            --accent-pink: #e6005c;
            --accent-yellow: #b38600;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 { 
            font-size: 2.5rem; 
            text-transform: uppercase; 
            letter-spacing: 4px; 
            margin-bottom: 5px;
            color: #000;
            font-weight: 800;
        }
        .subtitle { margin-bottom: 40px; color: #555; font-size: 0.95rem; letter-spacing: 1px; font-weight: 500; }
        
        .muro-container { display: flex; flex-direction: column; gap: 25px; width: 100%; max-width: 700px; margin-bottom: 40px; }
        
        .cartel { 
            background: var(--card-bg); 
            border: 2px solid #111; 
            border-radius: 12px; 
            padding: 30px; 
            text-align: center; 
            box-shadow: 6px 6px 0px #111;
            position: relative; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.2s ease;
        }
        .cartel:hover {
            transform: translateY(-2px);
            box-shadow: 8px 8px 0px #111, 0 0 15px rgba(0, 168, 204, 0.3);
            border-color: var(--accent-cyan);
        }
        .cartel-grande { min-height: 140px; }
        .cartel-mediano { min-height: 100px; }
        .cartel-pequeno { min-height: 70px; }

        .mensaje-texto {
            font-size: 1.5rem;
            font-weight: 600;
            margin: 0 0 10px 0;
            word-break: break-word;
        }
        .mensaje-autor {
            font-size: 0.9rem;
            color: #666;
            font-weight: 500;
            align-self: flex-end;
            margin-top: 5px;
        }
        
        .precio-tag { 
            position: absolute; 
            top: -12px; 
            right: 20px; 
            background: var(--accent-pink); 
            color: white; 
            padding: 4px 12px; 
            border-radius: 20px; 
            font-weight: bold; 
            font-size: 0.85rem;
            border: 2px solid #111;
        }
        
        .btn-comprar { 
            background: #111;
            color: #fff;
            border: none;
            padding: 10px 24px; 
            font-size: 0.85rem; 
            font-weight: 600; 
            cursor: pointer; 
            margin-top: 20px; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }
        .btn-comprar:hover { 
            background: var(--accent-cyan);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 168, 204, 0.4);
        }

        #modal-pago {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #fff;
            border: 2px solid #111;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            box-shadow: 8px 8px 0px #111;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .modal-content h3 { color: #111; margin-top: 0; letter-spacing: 1px; }
        .modal-content input, .modal-content textarea {
            background: #f4f5f7;
            border: 1px solid #ccc;
            padding: 12px;
            border-radius: 6px;
            color: #111;
            font-family: 'Inter', sans-serif;
            resize: none;
        }
        .modal-content input:focus, .modal-content textarea:focus {
            border-color: var(--accent-cyan);
            outline: none;
            box-shadow: 0 0 8px rgba(0, 168, 204, 0.2);
        }
        .modal-buttons { display: flex; gap: 10px; margin-top: 10px; }
        .modal-buttons button { flex: 1; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; }
        .btn-cancelar { background: transparent; border: 1px solid #999; color: #555; }
        .btn-cancelar:hover { border-color: #111; color: #111; }
        .btn-enviar { background: var(--accent-cyan); border: none; color: #fff; }
        .btn-enviar:hover { opacity: 0.9; }
        
        .listas-container { display: flex; gap: 20px; width: 100%; max-width: 700px; }
        .lista { background: var(--card-bg); flex: 1; padding: 20px; border: 2px solid #111; border-radius: 12px; box-shadow: 4px 4px 0px #111; }
        .lista h3 { margin-top: 0; font-size: 0.9rem; letter-spacing: 1px; color: #333; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        ul { list-style: none; padding: 0; margin: 0; font-size: 0.9rem; }
        li { padding: 8px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        
        @media (max-width: 600px) { .listas-container { flex-direction: column; } }
    </style>
</head>
<body>

    <h1>El Murazo</h1>
    <p class="subtitle">Paga. Escribe. Sé el último en hablar.</p>

    <div class="muro-container">
        <div class="cartel cartel-grande">
            <div class="precio-tag">10 €</div>
            <p class="mensaje-texto" id="texto-grande">"Cargando..."</p>
            <span class="mensaje-autor" id="autor-grande"></span>
            <button class="btn-comprar" onclick="abrirModal('grande', 10)">Sobreescribir Muro Grande</button>
        </div>
        <div class="cartel cartel-mediano">
            <div class="precio-tag">5 €</div>
            <p class="mensaje-texto" id="texto-mediano">"Cargando..."</p>
            <span class="mensaje-autor" id="autor-mediano"></span>
            <button class="btn-comprar" onclick="abrirModal('mediano', 5)">Sobreescribir Muro Mediano</button>
        </div>
        <div class="cartel cartel-pequeno">
            <div class="precio-tag">1 €</div>
            <p class="mensaje-texto" id="texto-pequeno">"Cargando..."</p>
            <span class="mensaje-autor" id="autor-pequeno"></span>
            <button class="btn-comprar" onclick="abrirModal('pequeno', 1)">Sobreescribir Muro Pequeño</button>
        </div>
    </div>

    <div id="modal-pago">
        <div class="modal-content">
            <h3 id="modal-titulo">Configurar Muro</h3>
            <input type="text" id="input-alias" placeholder="Tu Alias / Nombre" maxlength="25">
            <textarea id="input-mensaje" placeholder="Escribe tu mensaje aquí..." rows="3" maxlength="100"></textarea>
            <div class="modal-buttons">
                <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
                <button class="btn-enviar" onclick="irAPagar()">Continuar al Pago</button>
            </div>
        </div>
    </div>

    <div class="listas-container">
        <div class="lista">
            <h3><i class="fa-solid fa-bolt" style="color:var(--accent-cyan)"></i> ÚLTIMOS</h3>
            <ul id="lista-ultimos">
                <li><span>Cargando...</span></li>
            </ul>
        </div>
        <div class="lista">
            <h3><i class="fa-solid fa-crown" style="color:var(--accent-yellow)"></i> TOP</h3>
            <ul id="lista-top">
                <li><span>Cargando...</span></li>
            </ul>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, addDoc, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFE0T4m16MOyn9JqMujJZZwMJCLen-LgA",
            authDomain: "elmurazo.firebaseapp.com",
            projectId: "elmurazo",
            storageBucket: "elmurazo.firebasestorage.app",
            messagingSenderId: "722334671597",
            appId: "1:722334671597:web:4b316572169de9c66262e4",
            measurementId: "G-P003BX46Z4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const cartelesRef = doc(db, "muro", "textos");
        const historialRef = collection(db, "historial");

        let tierActual = '';
        let precioActual = 0;

        window.abrirModal = function(tamano, precio) {
            tierActual = tamano;
            precioActual = precio;
            document.getElementById("modal-titulo").innerText = `Muro ${tamano.toUpperCase()} (${precio}€)`;
            document.getElementById("modal-pago").style.display = "flex";
        }

        window.cerrarModal = function() {
            document.getElementById("modal-pago").style.display = "none";
        }

        window.irAPagar = function() {
            const alias = document.getElementById("input-alias").value.trim();
            const mensaje = document.getElementById("input-mensaje").value.trim();

            if (!alias || !mensaje) {
                alert("Por favor, rellena tu alias y el mensaje.");
                return;
            }

            localStorage.setItem("pending_alias", alias);
            localStorage.setItem("pending_mensaje", mensaje);
            localStorage.setItem("pending_tier", tierActual);
            localStorage.setItem("pending_precio", precioActual);

            const enlacesStripe = {
                'grande': 'https://buy.stripe.com/test_8x27sKdJidfs86l2p373G02',
                'mediano': 'https://buy.stripe.com/test_6oUeVccFea3gaet4xb73G01',
                'pequeno': 'https://buy.stripe.com/test_4gM8wOdJia3g4U91kZ73G00'
            };

            if (enlacesStripe[tierActual]) {
                window.location.href = enlacesStripe[tierActual];
            }
        }

        onSnapshot(cartelesRef, (documento) => {
            if (documento.exists()) {
                const datos = documento.data();
                ['grande', 'mediano', 'pequeno'].forEach(t => {
                    const val = datos[t];
                    const elTexto = document.getElementById(`texto-${t}`);
                    const elAutor = document.getElementById(`autor-${t}`);
                    
                    if (val) {
                        if (typeof val === 'object') {
                            elTexto.innerText = `"${val.texto}"`;
                            elAutor.innerText = `— ${val.autor}`;
                        } else {
                            elTexto.innerText = `"${val}"`;
                            elAutor.innerText = "";
                        }
                    } else {
                        elTexto.innerText = `"Muro vacío"`;
                        elAutor.innerText = "";
                    }
                });
            } else {
                ['grande', 'mediano', 'pequeno'].forEach(t => {
                    document.getElementById(`texto-${t}`).innerText = `"Muro vacío"`;
                    document.getElementById(`autor-${t}`).innerText = "";
                });
            }
        });

        onSnapshot(query(historialRef, orderBy("timestamp", "desc"), limit(5)), (snapshot) => {
            const listaUltimos = document.getElementById("lista-ultimos");
            listaUltimos.innerHTML = "";
            if (snapshot.empty) {
                listaUltimos.innerHTML = "<li><span>Sin registros</span></li>";
                return;
            }
            snapshot.forEach((doc) => {
                const d = doc.data();
                listaUltimos.innerHTML += `<li><span>${d.alias}</span> <span style="color:var(--accent-cyan)">${d.precio}€</span></li>`;
            });
        });

        onSnapshot(query(historialRef, orderBy("precio", "desc"), limit(5)), (snapshot) => {
            const listaTop = document.getElementById("lista-top");
            listaTop.innerHTML = "";
            if (snapshot.empty) {
                listaTop.innerHTML = "<li><span>Sin registros</span></li>";
                return;
            }
            snapshot.forEach((doc) => {
                const d = doc.data();
                listaTop.innerHTML += `<li><span>${d.alias}</span> <span style="color:var(--accent-yellow)">${d.precio}€</span></li>`;
            });
        });

        window.addEventListener('load', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('success') === 'true') {
                const alias = localStorage.getItem("pending_alias");
                const mensaje = localStorage.getItem("pending_mensaje");
                const tier = localStorage.getItem("pending_tier");
                const precio = Number(localStorage.getItem("pending_precio"));

                if (alias && mensaje && tier) {
                    try {
                        document.getElementById("texto-" + tier).innerText = `"Publicando..."`;
                        document.getElementById("autor-" + tier).innerText = "";
                        
                        await setDoc(cartelesRef, { 
                            [tier]: { texto: mensaje, autor: alias } 
                        }, { merge: true });

                        await addDoc(historialRef, {
                            alias: alias,
                            precio: precio,
                            timestamp: serverTimestamp()
                        });

                    } catch (error) {
                        console.error(error);
                    }
                    localStorage.removeItem("pending_alias");
                    localStorage.removeItem("pending_mensaje");
                    localStorage.removeItem("pending_tier");
                    localStorage.removeItem("pending_precio");
                }
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        });
    </script>
</body>
</html>
