<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Murazo | Construcción Global</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@700;900&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; background: #111; color: #fff; font-family: 'Inter', sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        .header { position: sticky; top: 0; background: rgba(17,17,17,0.9); padding: 20px; text-align: center; width: 100%; z-index: 10; border-bottom: 2px solid #333; }
        h1 { margin: 0; font-size: 2.5rem; text-transform: uppercase; color: #e6005c; }
        .reloj { font-size: 3rem; font-weight: 900; color: #00a8cc; text-shadow: 0 0 10px rgba(0, 168, 204, 0.5); margin: 10px 0; }
        .reloj.peligro { color: #ff3333; text-shadow: 0 0 15px #ff3333; animation: latido 1s infinite; }
        @keyframes latido { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
        
        .btn-comprar { background: #e6005c; color: #fff; border: none; padding: 15px 30px; font-size: 1.2rem; font-weight: 900; cursor: pointer; text-transform: uppercase; border-radius: 8px; box-shadow: 0 5px 15px rgba(230,0,92,0.4); margin-bottom: 10px; }
        .btn-comprar:hover { background: #ff1a75; transform: scale(1.05); }

        .muro { display: flex; flex-wrap: wrap-reverse; justify-content: center; align-content: flex-start; width: 100%; max-width: 1200px; padding: 20px; gap: 4px; }
        .ladrillo { background: #b22222; border: 2px solid #8b0000; border-radius: 4px; padding: 12px 20px; font-weight: 700; font-size: 1rem; color: #fff; text-shadow: 1px 1px 0 #000; box-shadow: inset 0 0 10px rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center; text-transform: uppercase; }
        
        /* Modal de compra */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); justify-content: center; align-items: center; z-index: 20; }
        .modal-box { background: #222; padding: 30px; border-radius: 12px; text-align: center; border: 2px solid #444; width: 90%; max-width: 400px; }
        .modal-box input { width: 90%; padding: 12px; font-size: 1rem; font-weight: bold; border-radius: 6px; border: none; margin: 15px 0; text-align: center; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="header">
        <h1>El Murazo</h1>
        <div id="reloj" class="reloj">Cargando...</div>
        <p>Si el reloj llega a 0, el muro se destruye.</p>
        <button class="btn-comprar" onclick="document.getElementById('modal').style.display='flex'">Poner Ladrillo (0,99€)</button>
    </div>

    <div class="muro" id="muro"></div>

    <div id="modal">
        <div class="modal-box">
            <h2 style="margin-top:0;">Tu Ladrillo</h2>
            <p>Escribe tu nombre o @usuario.</p>
            <input type="text" id="input-nombre" placeholder="TU NOMBRE" maxlength="15">
            <button class="btn-comprar" style="width: 100%;" onclick="irAPagar()">Ir al Pago</button>
            <button onclick="document.getElementById('modal').style.display='none'" style="margin-top:10px; background:none; color:#888; border:none; cursor:pointer;">Cancelar</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, setDoc, doc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFE0T4m16MOyn9JqMujJZZwMJCLen-LgA",
            authDomain: "elmurazo.firebaseapp.com",
            projectId: "elmurazo",
            storageBucket: "elmurazo.firebasestorage.app",
            messagingSenderId: "722334671597",
            appId: "1:722334671597:web:4b316572169de9c66262e4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const ladrillosRef = collection(db, "ladrillos");
        const estadoRef = doc(db, "estado", "global");

        let deadline = 0;
        let timerInterval;

        // Cargar ladrillos en tiempo real
        onSnapshot(ladrillosRef, (snapshot) => {
            const muro = document.getElementById("muro");
            muro.innerHTML = "";
            let ladrillos = [];
            snapshot.forEach(doc => ladrillos.push(doc.data()));
            // Ordenar para que los más nuevos estén arriba o se apilen natural
            ladrillos.sort((a, b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0));
            ladrillos.forEach(l => {
                const div = document.createElement("div");
                div.className = "ladrillo";
                div.innerText = l.nombre;
                muro.appendChild(div);
            });
        });

        // Cargar y gestionar reloj en tiempo real
        onSnapshot(estadoRef, (docSnap) => {
            if (docSnap.exists() && docSnap.data().deadline) {
                deadline = docSnap.data().deadline;
                actualizarReloj();
            }
        });

        function actualizarReloj() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const ahora = Date.now();
                const restante = deadline - ahora;
                const display = document.getElementById("reloj");

                if (restante <= 0) {
                    display.innerText = "💥 DESTRUIDO 💥";
                    display.className = "reloj peligro";
                    document.getElementById("muro").innerHTML = ""; // Simula destrucción visual
                    return;
                }

                const horas = Math.floor((restante / (1000 * 60 * 60)) % 24);
                const mins = Math.floor((restante / 1000 / 60) % 60);
                const secs = Math.floor((restante / 1000) % 60);
                
                display.innerText = `${horas.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                
                if (restante < 3600000) { display.className = "reloj peligro"; } 
                else { display.className = "reloj"; }
            }, 1000);
        }

        window.irAPagar = function() {
            const nombre = document.getElementById("input-nombre").value.trim().toUpperCase();
            if (!nombre) return alert("Pon un nombre");
            localStorage.setItem("nuevo_ladrillo", nombre);
            window.location.href = "https://buy.stripe.com/14A28q8oY5N05Yd2p373G04";
        }

        window.addEventListener('load', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('success') === 'true') {
                const nombre = localStorage.getItem("nuevo_ladrillo");
                if (nombre) {
                    // Guardar ladrillo
                    const id = Date.now().toString();
                    await setDoc(doc(db, "ladrillos", id), { nombre: nombre, timestamp: serverTimestamp() });
                    
                    // Reiniciar el reloj a 24h desde ahora
                    const nuevaDeadline = Date.now() + (24 * 60 * 60 * 1000);
                    await setDoc(estadoRef, { deadline: nuevaDeadline }, { merge: true });
                    
                    localStorage.removeItem("nuevo_ladrillo");
                    alert("¡Ladrillo colocado! Has salvado el muro 24 horas más.");
                }
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        });
    </script>
</body>
</html>
