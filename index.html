<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Murazo | El Millón de Creadores</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #f4f6f9;
            --grid-color: rgba(0, 168, 204, 0.15);
            --card-bg: #ffffff;
            --text-color: #111115;
            --accent-cyan: #00a8cc;
            --accent-pink: #e6005c;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-color);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-y: auto;
        }
        h1 { 
            font-size: 4rem; 
            text-transform: uppercase; 
            letter-spacing: 4px; 
            margin: 0 0 5px 0;
            color: #111;
            font-weight: 900;
            text-shadow: 3px 3px 0px #fff, 6px 6px 0px var(--accent-cyan);
            text-align: center;
        }
        .subtitle { margin-bottom: 15px; color: #555; font-size: 1rem; letter-spacing: 1px; font-weight: 700; text-transform: uppercase; background: #fff; padding: 5px 15px; border: 2px solid #111; border-radius: 20px; box-shadow: 3px 3px 0px #111;}
        
        .counter-box {
            font-size: 1rem;
            font-weight: 800;
            background: #111;
            color: #fff;
            padding: 8px 18px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 3px 3px 0px var(--accent-cyan);
            border: 2px solid #111;
        }
        
        .muro-canvas-container {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 1 / 1;
            background: #111;
            border: 4px solid #111;
            border-radius: 12px;
            box-shadow: 10px 10px 0px #111;
            position: relative;
            margin-bottom: 25px;
            cursor: pointer;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #1a1a1a;
            border-radius: 8px;
        }

        .btn-comprar-global {
            background: var(--accent-pink);
            color: #fff;
            border: 3px solid #111;
            padding: 15px 30px;
            font-size: 1.1rem;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 10px;
            box-shadow: 5px 5px 0px #111;
            transition: all 0.2s ease;
            margin-bottom: 30px;
            text-align: center;
        }
        .btn-comprar-global:hover {
            background: var(--accent-cyan);
            color: #000;
            transform: translate(-2px, -2px);
            box-shadow: 7px 7px 0px #111;
        }

        /* Modal */
        #modal-pago {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
            box-sizing: border-box;
        }
        .modal-content {
            background: #fff;
            border: 3px solid #111;
            padding: 25px;
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            box-shadow: 10px 10px 0px #111;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .modal-content h3 { color: #111; margin-top: 0; font-size: 1.2rem; text-transform: uppercase; }
        .modal-content input {
            background: #f4f6f9;
            border: 2px solid #ccc;
            padding: 10px;
            border-radius: 8px;
            color: #111;
            font-family: 'Inter', sans-serif;
            font-size: 0.95rem;
        }
        .modal-content input:focus {
            border-color: #111;
            outline: none;
            box-shadow: 3px 3px 0px var(--accent-cyan);
        }
        .modal-buttons { display: flex; gap: 10px; margin-top: 5px; }
        .modal-buttons button { flex: 1; padding: 10px; border-radius: 8px; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 0.85rem; border: 2px solid #111; }
        .btn-cancelar { background: #eee; color: #555; }
        .btn-enviar { background: var(--accent-cyan); color: #000; box-shadow: 3px 3px 0px #111; }
    </style>
</head>
<body>

    <h1>El Murazo</h1>
    <p class="subtitle">1 Millón de casillas • 1€ cada una</p>
    
    <div class="counter-box">
        Casillas libres: <span id="contador-libres">1,000,000</span>
    </div>

    <div class="muro-canvas-container">
        <canvas id="muroCanvas" width="1000" height="1000"></canvas>
    </div>

    <button class="btn-comprar-global" id="btn-comprar" onclick="abrirModal()">Selecciona casillas en el muro</button>

    <div id="modal-pago">
        <div class="modal-content">
            <h3>Reclamar Espacio</h3>
            <input type="text" id="input-alias" placeholder="Tu Nombre / Marca" maxlength="30">
            <input type="url" id="input-url" placeholder="Tu enlace (Web, IG, TikTok...)">
            <input type="text" id="input-info" placeholder="Casillas seleccionadas" readonly style="background:#e2e8f0; font-weight:bold;">
            <div class="modal-buttons">
                <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
                <button class="btn-enviar" onclick="irAPagar()">Ir al Pago</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, collection, getDocs, setDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFE0T4m16MOyn9JqMujJZZwMJCLen-LgA",
            authDomain: "elmurazo.firebaseapp.com",
            projectId: "elmurazo",
            storageBucket: "elmurazo.firebasestorage.app",
            messagingSenderId: "722334671597",
            appId: "1:722334671597:web:4b316572169de9c66262e4",
            measurementId: "G-P003BX46Z4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const casillasRef = collection(db, "casillas");

        const canvas = document.getElementById("muroCanvas");
        const ctx = canvas.getContext("2d");
        const gridCols = 100;
        const cellSize = canvas.width / gridCols;
        let casillasOcupadas = new Map();
        let selectedCoords = new Set();

        function dibujarMuro() {
            ctx.fillStyle = "#111115";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "rgba(0, 168, 204, 0.08)";
            ctx.lineWidth = 0.5;
            for (let x = 0; x < canvas.width; x += cellSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += cellSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Dibujar casillas ocupadas por otros
            casillasOcupadas.forEach((data, key) => {
                const [x, y] = key.split(',').map(Number);
                ctx.fillStyle = "#00a8cc";
                ctx.fillRect(x * cellSize, y * cellSize, cellSize - 0.5, cellSize - 0.5);
            });

            // Dibujar casillas seleccionadas por el usuario actual
            selectedCoords.forEach((key) => {
                const [x, y] = key.split(',').map(Number);
                ctx.fillStyle = "rgba(230, 0, 92, 0.7)";
                ctx.fillRect(x * cellSize, y * cellSize, cellSize - 0.5, cellSize - 0.5);
                ctx.strokeStyle = "#fff";
                ctx.lineWidth = 1.5;
                ctx.strokeRect(x * cellSize, y * cellSize, cellSize - 0.5, cellSize - 0.5);
            });

            const libres = 1000000 - casillasOcupadas.size;
            document.getElementById("contador-libres").innerText = libres.toLocaleString();

            // Actualizar el texto del botón dinámicamente en tiempo real
            const btnComprar = document.getElementById("btn-comprar");
            const total = selectedCoords.size;
            if (total === 0) {
                btnComprar.innerText = "Selecciona casillas en el muro";
            } else {
                btnComprar.innerText = `Comprar ${total} casilla${total > 1 ? 's' : ''} (${total}€)`;
            }
        }

        async function cargarCasillas() {
            const querySnapshot = await getDocs(casillasRef);
            casillasOcupadas.clear();
            querySnapshot.forEach((doc) => {
                casillasOcupadas.set(doc.id, doc.data());
            });
            dibujarMuro();
        }

        canvas.addEventListener("click", (e) => {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const x = Math.floor(((e.clientX - rect.left) * scaleX) / cellSize);
            const y = Math.floor(((e.clientY - rect.top) * scaleY) / cellSize);
            const key = `${x},${y}`;

            if (casillasOcupadas.has(key)) {
                const data = casillasOcupadas.get(key);
                if (confirm(`Este espacio es de ${data.alias}. ¿Quieres visitar su enlace?`)) {
                    window.open(data.url, '_blank');
                }
            } else {
                if (selectedCoords.has(key)) {
                    selectedCoords.delete(key);
                } else {
                    selectedCoords.add(key);
                }
                dibujarMuro();
            }
        });

        window.abrirModal = function() {
            if (selectedCoords.size === 0) {
                alert("Por favor, haz clic en al menos una casilla libre para seleccionarla.");
                return;
            }
            const total = selectedCoords.size;
            document.getElementById("input-info").value = `${total} casilla${total > 1 ? 's' : ''} (${total}€)`;
            document.getElementById("modal-pago").style.display = "flex";
        }

        window.cerrarModal = function() {
            document.getElementById("modal-pago").style.display = "none";
        }

        window.irAPagar = function() {
            const alias = document.getElementById("input-alias").value.trim();
            const url = document.getElementById("input-url").value.trim();

            if (!alias || !url || selectedCoords.size === 0) {
                alert("Por favor, rellena todos los campos.");
                return;
            }

            const listaCoords = Array.from(selectedCoords);
            const totalCasillas = selectedCoords.size;

            localStorage.setItem("p_alias", alias);
            localStorage.setItem("p_url", url);
            localStorage.setItem("p_coords", JSON.stringify(listaCoords));

            const stripeLink = "https://buy.stripe.com/4gM8wOdJia3g4U91kZ73G00";
            window.location.href = `${stripeLink}?prefilled_quantity=${totalCasillas}`;
        }

        window.addEventListener('load', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('success') === 'true') {
                const alias = localStorage.getItem("p_alias");
                const url = localStorage.getItem("p_url");
                const coordsJson = localStorage.getItem("p_coords");

                if (alias && url && coordsJson) {
                    try {
                        const listaCoords = JSON.parse(coordsJson);
                        for (const coord of listaCoords) {
                            await setDoc(doc(db, "casillas", coord), {
                                alias: alias,
                                url: url,
                                timestamp: serverTimestamp()
                            });
                        }
                        alert("¡Casillas compradas y publicadas con éxito!");
                    } catch (e) {
                        console.error(e);
                    }
                    localStorage.removeItem("p_alias");
                    localStorage.removeItem("p_url");
                    localStorage.removeItem("p_coords");
                }
                window.history.replaceState({}, document.title, window.location.pathname);
            }
            cargarCasillas();
        });
    </script>
</body>
</html>
