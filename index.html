<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Murazo - Tu mensaje por 1€</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --text-color: #333;
            --primary: #ffeb3b;
            --primary-dark: #fbc02d;
            --accent: #ff4757;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { font-size: 3rem; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; }
        .subtitle { margin-bottom: 30px; color: #666; }
        .muro-container { display: flex; flex-direction: column; gap: 20px; width: 100%; max-width: 800px; margin-bottom: 40px; }
        .cartel { background: #fff; border: 4px solid #222; border-radius: 8px; padding: 20px; text-align: center; box-shadow: 8px 8px 0px #222; position: relative; }
        .cartel-grande { min-height: 200px; font-size: 2rem; }
        .cartel-mediano { min-height: 120px; font-size: 1.5rem; }
        .cartel-pequeno { min-height: 80px; font-size: 1.2rem; }
        .precio-tag { position: absolute; top: -15px; right: -15px; background: var(--accent); color: white; padding: 10px 15px; border-radius: 50%; font-weight: bold; transform: rotate(15deg); border: 2px solid #222; }
        .btn-comprar { background-color: var(--primary); border: 2px solid #222; padding: 10px 20px; font-size: 1rem; font-weight: bold; cursor: pointer; margin-top: 15px; text-transform: uppercase; }
        .btn-comprar:hover { background-color: var(--primary-dark); transform: translateY(-2px); box-shadow: 4px 4px 0px #222; }
        .listas-container { display: flex; gap: 30px; width: 100%; max-width: 800px; }
        .lista { background: white; flex: 1; padding: 20px; border: 2px solid #222; border-radius: 8px; }
        .lista h3 { margin-top: 0; border-bottom: 2px solid #222; padding-bottom: 10px; }
        ul { list-style: none; padding: 0; margin: 0; }
        li { padding: 8px 0; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; }
        @media (max-width: 600px) { .listas-container { flex-direction: column; } }
    </style>
</head>
<body>

    <h1>🧱 El Murazo</h1>
    <p class="subtitle">Paga. Escribe. Sé el último en hablar.</p>

    <div class="muro-container">
        <div class="cartel cartel-grande">
            <div class="precio-tag">10€</div>
            <p id="texto-grande">"Cargando..."</p>
            <button class="btn-comprar" onclick="comprarEspacio('grande')">Sobreescribir Muro Grande</button>
        </div>
        <div class="cartel cartel-mediano">
            <div class="precio-tag">5€</div>
            <p id="texto-mediano">"Cargando..."</p>
            <button class="btn-comprar" onclick="comprarEspacio('mediano')">Sobreescribir Muro Mediano</button>
        </div>
        <div class="cartel cartel-pequeno">
            <div class="precio-tag">1€</div>
            <p id="texto-pequeno">"Cargando..."</p>
            <button class="btn-comprar" onclick="comprarEspacio('pequeno')">Sobreescribir Muro Pequeño</button>
        </div>
    </div>

    <div class="listas-container">
        <div class="lista">
            <h3>⚡ Últimos Donadores</h3>
            <ul id="lista-ultimos">
                <li><span>Usuario Anónimo</span> <span>1€</span></li>
            </ul>
        </div>
        <div class="lista">
            <h3>👑 Top Donadores</h3>
            <ul id="lista-top">
                <li><span>👑 CryptoBro</span> <span>50€</span></li>
            </ul>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFE0T4m16MOyn9JqMujJZZwMJCLen-LgA",
            authDomain: "elmurazo.firebaseapp.com",
            projectId: "elmurazo",
            storageBucket: "elmurazo.firebasestorage.app",
            messagingSenderId: "722334671597",
            appId: "1:722334671597:web:4b316572169de9c66262e4",
            measurementId: "G-P003BX46Z4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const cartelesRef = doc(db, "muro", "textos");

        onSnapshot(cartelesRef, (documento) => {
            if (documento.exists()) {
                const datos = documento.data();
                if(datos.grande) document.getElementById("texto-grande").innerText = `"${datos.grande}"`;
                if(datos.mediano) document.getElementById("texto-mediano").innerText = `"${datos.mediano}"`;
                if(datos.pequeno) document.getElementById("texto-pequeno").innerText = `"${datos.pequeno}"`;
            } else {
                document.getElementById("texto-grande").innerText = `"Muro vacío"`
                document.getElementById("texto-mediano").innerText = `"Muro vacío"`
                document.getElementById("texto-pequeno").innerText = `"Muro vacío"`
            }
        });

        window.comprarEspacio = function(tamano) {
            const enlacesStripe = {
                'grande': 'https://buy.stripe.com/test_8x27sKdJidfs86l2p373G02',
                'mediano': 'https://buy.stripe.com/test_6oUeVccFea3gaet4xb73G01',
                'pequeno': 'https://buy.stripe.com/test_4gM8wOdJia3g4U91kZ73G00'
            };

            if (enlacesStripe[tamano]) {
                window.location.href = enlacesStripe[tamano];
            }
        }
    </script>
</body>
</html>
