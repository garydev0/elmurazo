<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Murazo | El Millón de Creadores</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #f4f6f9;
            --grid-color: rgba(0, 168, 204, 0.15);
            --card-bg: #ffffff;
            --text-color: #111115;
            --accent-cyan: #00a8cc;
            --accent-pink: #e6005c;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 30px 30px;
            color: var(--text-color);
            margin: 0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 { 
            font-size: 2.8rem; 
            text-transform: uppercase; 
            letter-spacing: 4px; 
            margin-bottom: 5px;
            color: #111;
            font-weight: 900;
            text-shadow: 3px 3px 0px #fff, 5px 5px 0px var(--accent-cyan);
            text-align: center;
        }
        .subtitle { margin-bottom: 15px; color: #555; font-size: 0.95rem; letter-spacing: 1px; font-weight: 700; text-transform: uppercase; background: #fff; padding: 5px 15px; border: 2px solid #111; border-radius: 20px; box-shadow: 3px 3px 0px #111;}
        
        .counter-box {
            font-size: 1.1rem;
            font-weight: 800;
            background: #111;
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 30px;
            box-shadow: 4px 4px 0px var(--accent-cyan);
            border: 2px solid #111;
        }
        
        /* Contenedor del Muro / Cuadrícula Gigante */
        .muro-canvas-container {
            width: 100%;
            max-width: 1000px;
            height: 600px;
            background: #111;
            border: 3px solid #111;
            border-radius: 12px;
            box-shadow: 12px 12px 0px #111;
            position: relative;
            overflow: auto;
            margin-bottom: 30px;
            cursor: crosshair;
        }

        canvas {
            display: block;
            background: #1a1a1a;
        }

        .btn-comprar-global {
            background: var(--accent-pink);
            color: #fff;
            border: 3px solid #111;
            padding: 15px 35px;
            font-size: 1.2rem;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 10px;
            box-shadow: 6px 6px 0px #111;
            transition: all 0.2s ease;
            margin-bottom: 40px;
        }
        .btn-comprar-global:hover {
            background: var(--accent-cyan);
            color: #000;
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0px #111;
        }

        /* Modal */
        #modal-pago {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #fff;
            border: 3px solid #111;
            padding: 30px;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            box-shadow: 12px 12px 0px #111;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .modal-content h3 { color: #111; margin-top: 0; font-size: 1.4rem; text-transform: uppercase; }
        .modal-content input {
            background: #f4f6f9;
            border: 2px solid #ccc;
            padding: 12px;
            border-radius: 8px;
            color: #111;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
        }
        .modal-content input:focus {
            border-color: #111;
            outline: none;
            box-shadow: 3px 3px 0px var(--accent-cyan);
        }
        .modal-buttons { display: flex; gap: 10px; margin-top: 10px; }
        .modal-buttons button { flex: 1; padding: 12px; border-radius: 8px; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 0.9rem; border: 2px solid #111; }
        .btn-cancelar { background: #eee; color: #555; }
        .btn-enviar { background: var(--accent-cyan); color: #000; box-shadow: 3px 3px 0px #111; }
    </style>
</head>
<body>

    <h1>El Murazo</h1>
    <p class="subtitle">1 Millón de casillas. 1€ cada una. Tu espacio para siempre.</p>
    
    <div class="counter-box">
        Casillas libres: <span id="contador-libres">1,000,000</span> / 1,000,000
    </div>

    <div class="muro-canvas-container">
        <canvas id="muroCanvas" width="2000" height="2000"></canvas>
    </div>

    <button class="btn-comprar-global" onclick="abrirModal()">Comprar tu casilla (1€)</button>

    <div id="modal-pago">
        <div class="modal-content">
            <h3>Reclamar tu Casilla</h3>
            <input type="text" id="input-alias" placeholder="Tu Nombre / Marca" maxlength="30">
            <input type="url" id="input-url" placeholder="Tu enlace (Instagram, Web, TikTok...)">
            <input type="text" id="input-coords" placeholder="Coordenada deseada (ej: 10,15)" maxlength="10">
            <div class="modal-buttons">
                <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
                <button class="btn-enviar" onclick="irAPagar()">Ir al Pago (1€)</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, collection, getDocs, setDoc, doc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFE0T4m16MOyn9JqMujJZZwMJCLen-LgA",
            authDomain: "elmurazo.firebaseapp.com",
            projectId: "elmurazo",
            storageBucket: "elmurazo.firebasestorage.app",
            messagingSenderId: "722334671597",
            appId: "1:722334671597:web:4b316572169de9c66262e4",
            measurementId: "G-P003BX46Z4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const casillasRef = collection(db, "casillas");

        const canvas = document.getElementById("muroCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20; // Tamaño visual de cada casilla en el canvas
        let casillasOcupadas = new Map();

        function dibujarMuro() {
            ctx.fillStyle = "#111115";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Dibujar cuadrícula base
            ctx.strokeStyle = "rgba(0, 168, 204, 0.08)";
            ctx.lineWidth = 0.5;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }

            // Dibujar las casillas compradas
            casillasOcupadas.forEach((data, key) => {
                const [x, y] = key.split(',').map(Number);
                ctx.fillStyle = "#00a8cc";
                ctx.fillRect(x * gridSize, y * gridSize, gridSize - 1, gridSize - 1);
            });

            // Actualizar contador (1,000,000 total menos ocupadas)
            const libres = 1000000 - casillasOcupadas.size;
            document.getElementById("contador-libres").innerText = libres.toLocaleString();
        }

        async function cargarCasillas() {
            const querySnapshot = await getDocs(casillasRef);
            casillasOcupadas.clear();
            querySnapshot.forEach((doc) => {
                casillasOcupadas.set(doc.id, doc.data());
            });
            dibujarMuro();
        }

        window.abrirModal = function() {
            document.getElementById("modal-pago").style.display = "flex";
        }

        window.cerrarModal = function() {
            document.getElementById("modal-pago").style.display = "none";
        }

        window.irAPagar = function() {
            const alias = document.getElementById("input-alias").value.trim();
            const url = document.getElementById("input-url").value.trim();
            const coords = document.getElementById("input-coords").value.trim();

            if (!alias || !url || !coords) {
                alert("Por favor, rellena todos los campos.");
                return;
            }

            localStorage.setItem("p_alias", alias);
            localStorage.setItem("p_url", url);
            localStorage.setItem("p_coords", coords);

            // Enlace de Stripe configurado para 1€
            window.location.href = "https://buy.stripe.com/4gM8wOdJia3g4U91kZ73G00";
        }

        // Clic en el canvas para abrir enlace si la casilla está comprada
        canvas.addEventListener("click", (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left + canvas.parentElement.scrollLeft) / gridSize);
            const y = Math.floor((e.clientY - rect.top + canvas.parentElement.scrollTop) / gridSize);
            const key = `${x},${y}`;

            if (casillasOcupadas.has(key)) {
                const data = casillasOcupadas.get(key);
                if (confirm(`Visitar el espacio de ${data.alias} (${data.url})?`)) {
                    window.open(data.url, '_blank');
                }
            } else {
                document.getElementById("input-coords").value = `${x},${y}`;
                abrirModal();
            }
        });

        window.addEventListener('load', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('success') === 'true') {
                const alias = localStorage.getItem("p_alias");
                const url = localStorage.getItem("p_url");
                const coords = localStorage.getItem("p_coords");

                if (alias && url && coords) {
                    try {
                        await setDoc(doc(db, "casillas", coords), {
                            alias: alias,
                            url: url,
                            timestamp: serverTimestamp()
                        });
                        alert("¡Casilla comprada y publicada con éxito!");
                    } catch (e) {
                        console.error(e);
                    }
                    localStorage.removeItem("p_alias");
                    localStorage.removeItem("p_url");
                    localStorage.removeItem("p_coords");
                }
                window.history.replaceState({}, document.title, window.location.pathname);
            }
            cargarCasillas();
        });
    </script>
</body>
</html>
