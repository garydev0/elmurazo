<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Murazo | Cyber Wall</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #f4f6f9;
            --grid-color: rgba(0, 168, 204, 0.1);
            --card-bg: #ffffff;
            --text-color: #111115;
            --accent-cyan: #00a8cc;
            --accent-pink: #e6005c;
            --accent-yellow: #b38600;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 40px 40px;
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h1 { 
            font-size: 3rem; 
            text-transform: uppercase; 
            letter-spacing: 6px; 
            margin-bottom: 5px;
            color: #111;
            font-weight: 900;
            text-shadow: 4px 4px 0px #fff, 6px 6px 0px var(--accent-cyan);
        }
        .subtitle { margin-bottom: 40px; color: #555; font-size: 1rem; letter-spacing: 2px; font-weight: 700; text-transform: uppercase; background: #fff; padding: 5px 15px; border: 2px solid #111; border-radius: 20px; box-shadow: 3px 3px 0px #111;}
        
        .muro-container { 
            display: flex; 
            flex-direction: column; 
            gap: 40px; 
            width: 100%; 
            max-width: 850px; 
            margin-bottom: 60px;
            background: linear-gradient(145deg, #ffffff, #e6e9ef);
            padding: 40px;
            border-radius: 16px;
            border: 2px solid #d1d5db;
            box-shadow: 15px 15px 40px rgba(0,0,0,0.05), -15px -15px 40px rgba(255,255,255,0.8);
        }
        
        .cartel { 
            background: var(--card-bg); 
            border: 3px solid #111; 
            border-radius: 12px; 
            text-align: center; 
            position: relative; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            overflow: hidden;
        }
        .cartel:hover {
            transform: translateY(-5px) scale(1.01);
            border-color: var(--accent-cyan);
        }

        .cartel-grande { 
            min-height: 400px; 
            padding: 60px 40px;
            box-shadow: 12px 12px 0px #111;
            background: #111; 
            color: #fff;
        }
        .cartel-grande:hover { box-shadow: 12px 12px 0px var(--accent-cyan); border-color: var(--accent-cyan); }
        .cartel-grande .mensaje-texto { 
            font-size: clamp(2.5rem, 6vw, 4.5rem); 
            font-weight: 900; 
            line-height: 1.1; 
            text-transform: uppercase; 
            color: #fff;
            text-shadow: 3px 3px 0px var(--accent-pink);
        }

        .mensaje-texto { margin: 0 0 20px 0; word-break: break-word; }
        
        .precio-tag { 
            position: absolute; 
            top: 15px; 
            right: 15px; 
            background: var(--accent-pink); 
            color: white; 
            padding: 6px 16px; 
            border-radius: 20px; 
            font-weight: 900; 
            font-size: 1rem;
            border: 2px solid #111;
            box-shadow: 3px 3px 0px #111;
        }
        
        .btn-comprar { 
            background: #111;
            color: #fff;
            border: 2px solid #111;
            padding: 12px 28px; 
            font-size: 0.9rem; 
            font-weight: 700; 
            cursor: pointer; 
            text-transform: uppercase; 
            letter-spacing: 1px;
            border-radius: 8px;
            transition: all 0.2s ease;
        }
        .cartel-grande .btn-comprar { background: #fff; color: #111; font-size: 1.1rem; padding: 15px 35px; }
        .btn-comprar:hover { 
            background: var(--accent-cyan);
            color: #000;
            border-color: #000;
            transform: scale(1.05);
        }

        #modal-pago {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: #fff;
            border: 3px solid #111;
            padding: 40px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            box-shadow: 12px 12px 0px #111;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .modal-content h3 { color: #111; margin-top: 0; letter-spacing: 1px; font-size: 1.5rem; text-transform: uppercase; }
        .modal-content input, .modal-content textarea {
            background: #f4f6f9;
            border: 2px solid #ccc;
            padding: 15px;
            border-radius: 8px;
            color: #111;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            resize: none;
            transition: all 0.2s;
        }
        .modal-content input:focus, .modal-content textarea:focus {
            border-color: #111;
            background: #fff;
            outline: none;
            box-shadow: 4px 4px 0px var(--accent-cyan);
        }
        .modal-buttons { display: flex; gap: 15px; margin-top: 10px; }
        .modal-buttons button { flex: 1; padding: 15px; border-radius: 8px; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 0.9rem; border: 2px solid #111; }
        .btn-cancelar { background: #eee; color: #555; }
        .btn-cancelar:hover { background: #ddd; color: #111; }
        .btn-enviar { background: var(--accent-cyan); color: #000; box-shadow: 4px 4px 0px #111; }
        .btn-enviar:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0px #111; }
        
        .listas-container { display: flex; gap: 30px; width: 100%; max-width: 850px; }
        .lista { background: var(--card-bg); flex: 1; padding: 25px; border: 3px solid #111; border-radius: 12px; box-shadow: 8px 8px 0px #111; }
        .lista h3 { margin-top: 0; font-size: 1.1rem; font-weight: 800; letter-spacing: 1px; color: #111; border-bottom: 3px solid #111; padding-bottom: 15px; }
        ul { list-style: none; padding: 0; margin: 0; font-size: 1rem; }
        li { padding: 12px 0; border-bottom: 1px dashed #ccc; display: flex; justify-content: space-between; font-weight: 500; }
        
        @media (max-width: 700px) { .listas-container { flex-direction: column; } .cartel-grande { padding: 40px 20px; } }
    </style>
</head>
<body>

    <h1>El Murazo</h1>
    <p class="subtitle">Sé el último en hablar</p>

    <div class="muro-container">
        <!-- ÚNICO CARTEL -->
        <div class="cartel cartel-grande">
            <div class="precio-tag">1 €</div>
            <p class="mensaje-texto" id="texto-grande">"CARGANDO..."</p>
            <button class="btn-comprar" onclick="abrirModal('grande', 1)">Sobreescribir Muro</button>
        </div>
    </div>

    <div id="modal-pago">
        <div class="modal-content">
            <h3 id="modal-titulo">Configurar Muro</h3>
            <input type="text" id="input-alias" placeholder="Tu Alias / Nombre" maxlength="25">
            <textarea id="input-mensaje" placeholder="Escribe tu mensaje aquí..." rows="3" maxlength="100"></textarea>
            <div class="modal-buttons">
                <button class="btn-cancelar" onclick="cerrarModal()">Cancelar</button>
                <button class="btn-enviar" onclick="irAPagar()">Ir al Pago</button>
            </div>
        </div>
    </div>

    <div class="listas-container">
        <div class="lista">
            <h3><i class="fa-solid fa-bolt" style="color:var(--accent-cyan)"></i> ÚLTIMOS</h3>
            <ul id="lista-ultimos">
                <li><span>Cargando...</span></li>
            </ul>
        </div>
        <div class="lista">
            <h3><i class="fa-solid fa-crown" style="color:var(--accent-yellow)"></i> TOP</h3>
            <ul id="lista-top">
                <li><span>Cargando...</span></li>
            </ul>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, addDoc, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFE0T4m16MOyn9JqMujJZZwMJCLen-LgA",
            authDomain: "elmurazo.firebaseapp.com",
            projectId: "elmurazo",
            storageBucket: "elmurazo.firebasestorage.app",
            messagingSenderId: "722334671597",
            appId: "1:722334671597:web:4b316572169de9c66262e4",
            measurementId: "G-P003BX46Z4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const cartelesRef = doc(db, "muro", "textos");
        const historialRef = collection(db, "historial");

        let tierActual = '';
        let precioActual = 0;

        window.abrirModal = function(tamano, precio) {
            tierActual = tamano;
            precioActual = precio;
            document.getElementById("modal-titulo").innerText = `Muro Principal (${precio}€)`;
            document.getElementById("modal-pago").style.display = "flex";
        }

        window.cerrarModal = function() {
            document.getElementById("modal-pago").style.display = "none";
        }

        window.irAPagar = function() {
            const alias = document.getElementById("input-alias").value.trim();
            const mensaje = document.getElementById("input-mensaje").value.trim();

            if (!alias || !mensaje) {
                alert("Por favor, rellena tu alias y el mensaje.");
                return;
            }

            localStorage.setItem("pending_alias", alias);
            localStorage.setItem("pending_mensaje", mensaje);
            localStorage.setItem("pending_tier", tierActual);
            localStorage.setItem("pending_precio", precioActual);

            // Enlace de Stripe actualizado para el muro de 1€
            const enlacesStripe = {
                'grande': 'https://buy.stripe.com/test_4gM8wOdJia3g4U91kZ73G00' 
            };

            if (enlacesStripe[tierActual]) {
                window.location.href = enlacesStripe[tierActual];
            }
        }

        onSnapshot(cartelesRef, (documento) => {
            const elTexto = document.getElementById("texto-grande");
            if (documento.exists()) {
                const datos = documento.data();
                const val = datos.grande;
                if (val) {
                    if (typeof val === 'object') {
                        elTexto.innerText = `"${val.texto}"`;
                    } else {
                        elTexto.innerText = `"${val}"`;
                    }
                } else {
                    elTexto.innerText = `"Muro vacío"`;
                }
            } else {
                elTexto.innerText = `"Muro vacío"`;
            }
        });

        onSnapshot(query(historialRef, orderBy("timestamp", "desc"), limit(5)), (snapshot) => {
            const listaUltimos = document.getElementById("lista-ultimos");
            listaUltimos.innerHTML = "";
            if (snapshot.empty) {
                listaUltimos.innerHTML = "<li><span>Sin registros</span></li>";
                return;
            }
            snapshot.forEach((doc) => {
                const d = doc.data();
                listaUltimos.innerHTML += `<li><span>${d.alias}</span> <span style="color:var(--accent-cyan); font-weight:bold;">${d.precio}€</span></li>`;
            });
        });

        onSnapshot(query(historialRef, orderBy("precio", "desc"), limit(5)), (snapshot) => {
            const listaTop = document.getElementById("lista-top");
            listaTop.innerHTML = "";
            if (snapshot.empty) {
                listaTop.innerHTML = "<li><span>Sin registros</span></li>";
                return;
            }
            snapshot.forEach((doc) => {
                const d = doc.data();
                listaTop.innerHTML += `<li><span>${d.alias}</span> <span style="color:var(--accent-yellow); font-weight:bold;">${d.precio}€</span></li>`;
            });
        });

        window.addEventListener('load', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('success') === 'true') {
                const alias = localStorage.getItem("pending_alias");
                const mensaje = localStorage.getItem("pending_mensaje");
                const tier = localStorage.getItem("pending_tier");
                const precio = Number(localStorage.getItem("pending_precio"));

                if (alias && mensaje && tier) {
                    try {
                        document.getElementById("texto-" + tier).innerText = `"Publicando..."`;
                        
                        await setDoc(cartelesRef, { 
                            [tier]: { texto: mensaje, autor: alias } 
                        }, { merge: true });

                        await addDoc(historialRef, {
                            alias: alias,
                            precio: precio,
                            timestamp: serverTimestamp()
                        });

                    } catch (error) {
                        console.error(error);
                    }
                    localStorage.removeItem("pending_alias");
                    localStorage.removeItem("pending_mensaje");
                    localStorage.removeItem("pending_tier");
                    localStorage.removeItem("pending_precio");
                }
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        });
    </script>
</body>
</html>
