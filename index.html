<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Murazo | Construcción Global</title>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Share+Tech+Mono&family=Inter:wght@900&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            background-color: #1a1a1a; 
            background-image: radial-gradient(#333 2px, transparent 2px), radial-gradient(#333 2px, transparent 2px);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
            color: #fff; 
            font-family: 'Inter', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh; 
            overflow-x: hidden; 
        }
        
        .cinta-peligro {
            width: 100%;
            height: 15px;
            background: repeating-linear-gradient(45deg, #ffd700, #ffd700 20px, #111 20px, #111 40px);
            z-index: 11;
        }

        .header { 
            position: sticky; 
            top: 0; 
            background: rgba(20, 20, 20, 0.95); 
            padding: 20px; 
            text-align: center; 
            width: 100%; 
            z-index: 10; 
            border-bottom: 4px solid #111; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        h1 { 
            margin: 0; 
            font-size: 3rem; 
            font-family: 'Black Ops One', cursive;
            color: #888; 
            text-shadow: 3px 3px 0 #000;
        }
        
        .reloj { 
            font-family: 'Share Tech Mono', monospace; 
            font-size: 4.5rem; 
            color: #ff0000; 
            text-shadow: 0 0 10px #ff0000, 0 0 20px #cc0000; 
            margin: 10px 0; 
            letter-spacing: 2px;
        }
        .reloj.peligro { animation: latido 0.5s infinite alternate; }
        @keyframes latido { 
            from { text-shadow: 0 0 10px #ff0000; transform: scale(1); } 
            to { text-shadow: 0 0 30px #ff0000, 0 0 50px #ff0000; transform: scale(1.02); } 
        }
        
        .btn-comprar { 
            background: #ffd700; 
            color: #111; 
            border: 3px solid #111; 
            padding: 15px 30px; 
            font-size: 1.2rem; 
            font-family: 'Black Ops One', cursive;
            cursor: pointer; 
            box-shadow: 5px 5px 0 #111; 
            transition: all 0.1s;
        }
        .btn-comprar:hover { 
            transform: translate(2px, 2px); 
            box-shadow: 3px 3px 0 #111; 
            background: #ffea00;
        }

        .muro { 
            display: flex; 
            flex-wrap: wrap-reverse; 
            justify-content: center; 
            align-content: flex-start; 
            width: 100%; 
            max-width: 1200px; 
            padding: 40px 20px; 
            gap: 4px; 
        }
        
        /* Ladrillos Marrones */
        .ladrillo { 
            background: #8b3a2f; 
            border: 2px solid #4a1c14; 
            border-radius: 2px; 
            padding: 15px 25px; 
            font-family: 'Black Ops One', cursive; 
            font-size: 1.2rem; 
            color: #111; 
            text-shadow: 1px 1px 0 rgba(255,255,255,0.2); 
            box-shadow: inset 0 0 15px rgba(0,0,0,0.6), 2px 2px 5px rgba(0,0,0,0.4); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            position: relative;
            transition: transform 0.3s ease;
        }
        
        /* El Rey (Último Ladrillo) */
        .ladrillo.rey {
            background: #ffd700;
            border-color: #ffaa00;
            box-shadow: 0 0 20px #ffd700, inset 0 0 10px rgba(0,0,0,0.3);
            z-index: 5;
            animation: brillar 1.5s infinite alternate;
        }
        .ladrillo.rey::before { content: '👑 '; margin-right: 5px; }
        @keyframes brillar {
            from { box-shadow: 0 0 10px #ffd700; }
            to { box-shadow: 0 0 30px #ffea00; }
        }

        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 20; }
        .modal-box { background: #222; padding: 30px; border: 4px solid #555; text-align: center; width: 90%; max-width: 400px; box-shadow: 10px 10px 0 #000; }
        .modal-box h2 { font-family: 'Black Ops One', cursive; color: #ffd700; margin-top: 0;}
        .modal-box input { width: 85%; padding: 15px; font-size: 1.2rem; font-family: 'Black Ops One', cursive; border: 2px solid #111; background: #999; margin: 15px 0; text-align: center; text-transform: uppercase; color: #111; }
        .modal-box input::placeholder { color: #555; }
    </style>
</head>
<body>

    <div class="cinta-peligro"></div>
    <div class="header">
        <h1>EL MURAZO</h1>
        <div id="reloj" class="reloj">--:--:--</div>
        <p style="color: #aaa; font-weight: bold; letter-spacing: 1px;">SI EL RELOJ LLEGA A CERO, EL MURO SE DEMUELE.</p>
        <button class="btn-comprar" onclick="document.getElementById('modal').style.display='flex'">GRABAR LADRILLO (0,99€)</button>
    </div>
    <div class="cinta-peligro"></div>

    <div class="muro" id="muro"></div>

    <div id="modal">
        <div class="modal-box">
            <h2>NUEVO BLOQUE</h2>
            <p style="color:#aaa;">Corónate como el Rey del Muro.</p>
            <input type="text" id="input-nombre" placeholder="TU NOMBRE" maxlength="15">
            <button class="btn-comprar" style="width: 100%;" onclick="irAPagar()">IR AL PAGO</button>
            <button onclick="document.getElementById('modal').style.display='none'" style="margin-top:15px; background:none; color:#777; font-weight:bold; border:none; cursor:pointer; text-decoration: underline;">ABORTAR</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, setDoc, doc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.4.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCFE0T4m16MOyn9JqMujJZZwMJCLen-LgA",
            authDomain: "elmurazo.firebaseapp.com",
            projectId: "elmurazo",
            storageBucket: "elmurazo.firebasestorage.app",
            messagingSenderId: "722334671597",
            appId: "1:722334671597:web:4b316572169de9c66262e4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const ladrillosRef = collection(db, "ladrillos");
        const estadoRef = doc(db, "estado", "global");

        let deadline = 0;
        let timerInterval;

        onSnapshot(ladrillosRef, (snapshot) => {
            const muro = document.getElementById("muro");
            muro.innerHTML = "";
            let ladrillos = [];
            snapshot.forEach(doc => ladrillos.push(doc.data()));
            ladrillos.sort((a, b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0));
            
            ladrillos.forEach((l, index) => {
                const div = document.createElement("div");
                div.className = "ladrillo";
                
                // Aplicar estilo de Rey al último ladrillo
                if (index === ladrillos.length - 1) {
                    div.classList.add("rey");
                    div.style.transform = `rotate(0deg) scale(1.15)`; // Más grande y recto
                } else {
                    const rotacion = (Math.random() * 2 - 1).toFixed(1);
                    div.style.transform = `rotate(${rotacion}deg)`;
                }
                
                div.innerText = l.nombre;
                muro.appendChild(div);
            });
        });

        onSnapshot(estadoRef, (docSnap) => {
            if (docSnap.exists() && docSnap.data().deadline) {
                deadline = docSnap.data().deadline;
                actualizarReloj();
            }
        });

        function actualizarReloj() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const ahora = Date.now();
                const restante = deadline - ahora;
                const display = document.getElementById("reloj");

                if (restante <= 0) {
                    display.innerText = "00:00:00";
                    display.className = "reloj peligro";
                    document.getElementById("muro").innerHTML = ""; 
                    return;
                }

                const horas = Math.floor((restante / (1000 * 60 * 60)) % 24);
                const mins = Math.floor((restante / 1000 / 60) % 60);
                const secs = Math.floor((restante / 1000) % 60);
                
                display.innerText = `${horas.toString().padStart(2, '0')}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
                
                if (restante < 3600000) { display.className = "reloj peligro"; } 
                else { display.className = "reloj"; }
            }, 1000);
        }

        window.irAPagar = function() {
            const nombre = document.getElementById("input-nombre").value.trim().toUpperCase();
            if (!nombre) return alert("Escribe un nombre para el muro.");
            localStorage.setItem("nuevo_ladrillo", nombre);
            window.location.href = "https://buy.stripe.com/14A28q8oY5N05Yd2p373G04";
        }

        window.addEventListener('load', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('success') === 'true') {
                const nombre = localStorage.getItem("nuevo_ladrillo");
                if (nombre) {
                    const id = Date.now().toString();
                    await setDoc(doc(db, "ladrillos", id), { nombre: nombre, timestamp: serverTimestamp() });
                    const nuevaDeadline = Date.now() + (24 * 60 * 60 * 1000);
                    await setDoc(estadoRef, { deadline: nuevaDeadline }, { merge: true });
                    localStorage.removeItem("nuevo_ladrillo");
                }
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        });
    </script>
</body>
</html>
