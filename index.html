<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EL MURAZO | Sistema Forense Móvil</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-outer: #030712;
      --phone-bg: #090d16;
      --card-bg: rgba(30, 41, 59, 0.65);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-red: #f43f5e;
      --accent-blue: #38bdf8;
      --accent-green: #10b981;
      --accent-amber: #f59e0b;
      --accent-purple: #a855f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #030712 70%);
      color: var(--text-main);
      height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* CHASIS DEL SMARTPHONE */
    .phone-chassis {
      width: 390px;
      height: 820px;
      max-height: 96dvh;
      background: var(--phone-bg);
      border-radius: 50px;
      border: 10px solid #1e293b;
      box-shadow: 
        0 0 0 2px #0f172a,
        0 30px 80px rgba(0, 0, 0, 0.85),
        inset 0 0 25px rgba(56, 189, 248, 0.05);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background-image: 
        radial-gradient(at 0% 0%, rgba(244, 63, 94, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(56, 189, 248, 0.12) 0px, transparent 50%);
    }

    /* En móviles reales ocupa toda la pantalla sin bordes */
    @media (max-width: 450px) {
      .phone-chassis {
        width: 100vw;
        height: 100dvh;
        max-height: 100dvh;
        border-radius: 0;
        border: none;
      }
    }

    /* BARRA DE ESTADO E ISLA DINÁMICA */
    .status-bar {
      height: 44px;
      padding: 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      z-index: 20;
      flex-shrink: 0;
    }
    .dynamic-island {
      width: 110px;
      height: 24px;
      background: #000;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--accent-red);
      border: 1px solid rgba(255,255,255,0.07);
    }
    .rec-dot {
      width: 6px;
      height: 6px;
      background: var(--accent-red);
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.2; } }

    /* PANTALLA PRINCIPAL */
    .phone-viewport {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px 24px;
      display: flex;
      flex-direction: column;
      scrollbar-width: none;
    }
    .phone-viewport::-webkit-scrollbar { display: none; }

    /* WIDGET SUPERIOR DEL HOME */
    .forensic-widget {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.8), rgba(15, 23, 42, 0.9));
      border: 1px solid var(--card-border);
      border-left: 3px solid var(--accent-red);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 22px;
      backdrop-filter: blur(12px);
    }
    .widget-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: var(--accent-red);
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .forensic-widget h1 { font-size: 1.15rem; font-weight: 800; margin-bottom: 6px; }
    .forensic-widget p { font-size: 0.8rem; color: var(--text-muted); line-height: 1.45; }

    /* GRID DE ICONOS ESTILO iOS */
    .ios-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px 14px;
      margin-top: 4px;
    }
    .app-Launcher {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      user-select: none;
      transition: transform 0.15s ease;
    }
    .app-Launcher:active { transform: scale(0.92); }
    .app-squircle {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      margin-bottom: 7px;
      position: relative;
      box-shadow: 0 8px 20px rgba(0,0,0,0.35), inset 0 1px 1px rgba(255,255,255,0.2);
    }
    .app-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background: var(--accent-red);
      color: white;
      font-size: 0.68rem;
      font-weight: 800;
      min-width: 20px;
      height: 20px;
      padding: 0 5px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--phone-bg);
    }
    .app-label {
      font-size: 0.76rem;
      font-weight: 600;
      color: #e2e8f0;
      text-align: center;
    }

    /* COLORES DE CADA APP */
    .bg-cases { background: linear-gradient(135deg, #6366f1, #4338ca); }
    .bg-Suspects { background: linear-gradient(135deg, #f43f5e, #be123c); }
    .bg-chat { background: linear-gradient(135deg, #10b981, #047857); }
    .bg-mail { background: linear-gradient(135deg, #38bdf8, #0284c7); }
    .bg-maps { background: linear-gradient(135deg, #f59e0b, #b45309); }
    .bg-bank { background: linear-gradient(135deg, #a855f7, #6b21a8); }
    .bg-notes { background: linear-gradient(135deg, #eab308, #a16207); }
    .bg-solve { background: linear-gradient(135deg, #ec4899, #9d174d); }

    /* CABECERA INTERNA DE LAS APPS */
    .app-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 14px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      background: rgba(9, 13, 22, 0.9);
      backdrop-filter: blur(8px);
      z-index: 10;
    }
    .btn-back-ios {
      background: rgba(255,255,255,0.07);
      border: none;
      color: var(--accent-blue);
      padding: 6px 12px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .app-title-header { font-size: 0.95rem; font-weight: 800; }

    /* COMPONENTES INTERNOS DE LAS APPS (CARDS, CHATS, MAPS, BANCO) */
    .glass-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .meta-line {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--accent-blue);
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .chat-contact-btn {
      width: 100%;
      text-align: left;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 10px;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .bubble {
      background: #1e293b;
      padding: 10px 14px;
      border-radius: 16px 16px 16px 4px;
      margin-bottom: 10px;
      font-size: 0.84rem;
      line-height: 1.45;
      max-width: 88%;
    }
    .bubble.sent {
      background: #065f46;
      border-radius: 16px 16px 4px 16px;
      align-self: flex-end;
      margin-left: auto;
    }
    .timeline-node {
      border-left: 2px dashed var(--accent-amber);
      padding-left: 14px;
      margin-left: 8px;
      margin-bottom: 16px;
      position: relative;
    }
    .timeline-node::before {
      content: '📍';
      position: absolute;
      left: -11px;
      top: 0;
      font-size: 0.85rem;
    }
    .bank-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--card-border);
    }
    .amount-neg { font-family: 'JetBrains Mono', monospace; color: var(--accent-red); font-weight: 700; }

    /* INPUTS Y BOTONES */
    .pin-box {
      width: 100%;
      padding: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.4rem;
      text-align: center;
      letter-spacing: 8px;
      background: #030712;
      border: 1px solid rgba(255,255,255,0.15);
      color: white;
      border-radius: 14px;
      margin: 12px 0;
    }
    .select-modern {
      width: 100%;
      padding: 12px;
      background: #0f172a;
      border: 1px solid rgba(255,255,255,0.15);
      color: white;
      border-radius: 12px;
      margin: 6px 0 14px;
      font-size: 0.85rem;
    }
    .btn-primary {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent-red), #e11d48);
      color: white;
      border: none;
      border-radius: 14px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      margin-top: 8px;
    }

    /* BARRA INFERIOR HOME (DOCK BAR) */
    .home-bar-Area {
      height: 34px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }
    .home-pill {
      width: 130px;
      height: 5px;
      background: rgba(255, 255, 255, 0.35);
      border-radius: 10px;
      transition: background 0.2s, transform 0.2s;
    }
    .home-bar-Area:hover .home-pill { background: white; transform: scaleX(1.08); }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake-anim { animation: shake 0.35s ease-in-out; }
  </style>
</head>
<body>

  <div class="phone-chassis" id="phone-chassis">
    <!-- BARRA DE ESTADO DEL MÓVIL -->
    <div class="status-bar">
      <span id="os-clock">02:15</span>
      <div class="dynamic-island">
        <span class="rec-dot"></span>
        <span>MURAZO OS</span>
      </div>
      <span style="cursor:pointer;" id="btn-mute" onclick="SoundEngine.toggleMute()">🔊 5G</span>
    </div>

    <!-- PANTALLA CAMBIANTE DEL MÓVIL -->
    <div class="phone-viewport" id="screen"></div>

    <!-- BARRA INFERIOR PARA VOLVER AL MENÚ EN CUALQUIER MOMENTO -->
    <div class="home-bar-Area" onclick="OS.goHome()" title="Volver a la pantalla de inicio">
      <div class="home-pill"></div>
    </div>
  </div>

  <script src="js/engine.js"></script>
</body>
</html>
