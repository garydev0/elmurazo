<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EL MURAZO | Expedientes Interactivos</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #020617;
      --panel-bg: #0f172a;
      --border: #1e293b;
      --accent: #ef4444;
      --accent-amber: #f59e0b;
      --accent-green: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 14px 20px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .case-selector {
      background: var(--bg-dark);
      color: var(--accent-amber);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .view-switcher { display: flex; gap: 8px; align-items: center; }
    .btn-tab {
      background: var(--panel-bg);
      color: var(--text-muted);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      transition: 0.2s;
    }
    .btn-tab.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .btn-sound {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
    }

    main {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    /* VISTA A: TABLÓN */
    #view-board {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 18px;
    }
    .clue-card {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-top: 3px solid var(--accent);
      border-radius: 10px;
      padding: 18px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .clue-card.vip-card { border-top-color: var(--accent-green); }
    .clue-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.7rem;
      color: var(--accent-amber);
      text-transform: uppercase;
      margin-bottom: 6px;
      display: block;
    }
    .clue-card h3 { font-size: 1.05rem; margin-bottom: 10px; }
    .clue-card p { font-size: 0.9rem; color: var(--text-muted); line-height: 1.5; }
    .suspect-item {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed var(--border);
      font-size: 0.85rem;
    }

    /* VISTA B: MÓVIL */
    #view-phone { display: none; justify-content: center; width: 100%; }
    .phone-frame {
      width: 365px;
      height: 680px;
      background: #090d16;
      border: 8px solid #1e293b;
      border-radius: 38px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0,0,0,0.7);
    }
    .phone-statusbar {
      padding: 10px 20px;
      background: #020617;
      display: flex;
      justify-content: space-between;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      border-bottom: 1px solid #1e293b;
    }
    .phone-screen {
      flex: 1;
      padding: 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .app-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 10px;
    }
    .app-icon {
      background: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px 10px;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }
    .app-icon:hover { transform: translateY(-2px); border-color: var(--accent-amber); }
    .app-icon span { font-size: 1.7rem; display: block; margin-bottom: 6px; }
    .app-icon small { font-weight: 600; font-size: 0.8rem; }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 12px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .btn-back {
      background: none;
      border: none;
      color: var(--accent-amber);
      font-weight: 600;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .chat-bubble {
      background: #1e293b;
      padding: 10px 12px;
      border-radius: 10px;
      margin-bottom: 10px;
      font-size: 0.85rem;
      line-height: 1.4;
    }
    .chat-meta {
      font-size: 0.7rem;
      color: var(--accent-amber);
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 4px;
      display: block;
    }
    .photo-item {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .photo-visual {
      background: #020617;
      border: 1px dashed var(--accent-amber);
      padding: 14px;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      margin-bottom: 8px;
      border-radius: 6px;
      color: #fde047;
      font-size: 0.85rem;
    }
    .pin-input, .select-input {
      width: 100%;
      padding: 11px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      text-align: center;
      background: #020617;
      border: 1px solid var(--border);
      color: white;
      border-radius: 8px;
      margin: 8px 0 12px;
    }
    .btn-action {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 8px;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake-anim { animation: shake 0.35s ease-in-out; }

    /* MODAL MURO DE PAGO */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.9);
      backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }
    .modal-box {
      background: var(--panel-bg);
      border: 2px solid var(--accent);
      border-radius: 16px;
      max-width: 430px;
      width: 100%;
      padding: 24px;
      text-align: center;
    }
    .modal-box h2 { margin: 10px 0; font-size: 1.3rem; }
    .modal-box p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 16px; line-height: 1.5; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>EL MURAZO</span>
      <select id="case-selector" class="case-selector" onchange="Engine.changeCase(this.value)"></select>
    </div>
    <div class="view-switcher">
      <button class="btn-tab active" id="tab-board" onclick="Engine.switchMainView('board')">📋 Tablón</button>
      <button class="btn-tab" id="tab-phone" onclick="Engine.switchMainView('phone')">📱 Móvil Hallado</button>
      <button class="btn-sound" id="btn-mute" onclick="SoundEngine.toggleMute()" title="Audio">🔊</button>
    </div>
  </header>

  <main>
    <section id="view-board"></section>

    <section id="view-phone">
      <div class="phone-frame" id="phone-frame-el">
        <div class="phone-statusbar">
          <span id="phone-clock">02:15 AM</span>
          <span id="phone-status-badge">🔋 12% | EVIDENCIA</span>
        </div>
        <div class="phone-screen" id="phone-screen-content"></div>
      </div>
    </section>
  </main>

  <!-- MODAL PAYWALL -->
  <div class="modal-overlay" id="paywall-modal">
    <div class="modal-box">
      <span class="clue-tag" style="color:var(--accent);">SEÑAL DE AUDIO INTERRUMPIDA</span>
      <h2>Has chocado contra El Murazo</h2>
      <p id="paywall-desc">El archivo de audio completo contiene la voz del culpable en el parking, la papelera de fotos borradas y el sistema de acusación final.</p>
      <button class="btn-action" id="btn-buy-link">
        🔓 Desbloquear Caso Completo (4,99 €)
      </button>
      <div style="margin-top:16px; padding-top:14px; border-top:1px solid var(--border);">
        <small style="color:var(--text-muted);">¿Ya tienes tu código VIP? (Prueba: <strong>MURAZO99</strong>)</small>
        <input type="text" id="vip-code-input" class="pin-input" placeholder="INTRODUCE CÓDIGO VIP" oninput="SoundEngine.key()">
        <button class="btn-tab" style="width:100%;" onclick="Engine.verifyVipCode()">Validar Código VIP</button>
      </div>
      <button class="btn-back" style="margin-top:12px;" onclick="Engine.closePaywall()">Cerrar ventana</button>
    </div>
  </div>

  <script src="js/engine.js"></script>
</body>
</html>
